# GitHub Pages 部署（legacy「从分支部署」模式）
# 把网站文件推到 gh-pages 分支，Pages 直接以该分支为源（build_type: legacy）。
# 注意：archive/ 必须保留 —— app.js 的 loadManifest()/viewArchive() 依赖它实现历史回溯功能
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'app.js'
      - 'config.js'
      - 'data.json'
      - 'donate.html'
      - 'assets/**'
      - 'archive/**'
      - '.nojekyll'
      - '.github/workflows/pages.yml'
  # 关键修复：refresh.yml 用 GITHUB_TOKEN 推送 data.json 不会触发上面的 on:push
  # （GitHub 防递归限制），故改用 workflow_run —— 每次「刷新看板数据」成功即自动重建部署
  workflow_run:
    workflows: ["刷新看板数据"]
    types: [completed]
  workflow_dispatch:  # 支持手动触发重新部署

permissions:
  contents: write   # 需要写 gh-pages 分支

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-and-deploy:
    # 仅在 refresh 成功时才部署（失败则不重建）
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site files（仅网站文件）
        run: |
          mkdir -p /tmp/site
          # 网站核心文件
          cp index.html app.js config.js data.json donate.html .nojekyll /tmp/site/
          # 静态资源
          mkdir -p /tmp/site/assets
          cp -r assets/* /tmp/site/assets/ 2>/dev/null || true
          # 历史快照（回溯/历史查看功能依赖 archive/，必须保留）
          mkdir -p /tmp/site/archive
          cp -r archive/* /tmp/site/archive/ 2>/dev/null || true
          echo "=== 部署文件清单 ==="
          find /tmp/site -type f | sort
          echo "=== 总大小 ==="
          du -sh /tmp/site

      - name: Deploy to gh-pages branch
        run: |
          cd /tmp/site
          git init
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy: $(date -u +%Y-%m-%dT%H:%M:%SZ)"
          git push --force "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" HEAD:gh-pages
